<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мониторинг конкурентов</title>
<style>
  :root {
    --bg: #f5f3ee; --card: #fffdf9; --ink: #1d2433; --muted: #6b7280; --line: #e3ded3;
    --accent: #1f5f8b; --accent-ink: #fff; --good: #2f7d4f; --warn: #b7791f; --bad: #b4443a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14181f; --card: #1b212b; --ink: #e8ebf0; --muted: #98a2b3; --line: #2b3342;
            --accent: #5aa7d6; --accent-ink: #0d1218; --good: #5fbf88; --warn: #e0a84a; --bad: #e07b70; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  header { padding: 28px 16px 8px; max-width: 920px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 26px; letter-spacing: -.01em; }
  header p { margin: 0; color: var(--muted); }
  main { max-width: 920px; margin: 0 auto; padding: 16px; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  nav button { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 8px 16px;
               border-radius: 999px; font: inherit; cursor: pointer; }
  nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  textarea, input[type=url] { width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
        font: inherit; background: var(--bg); color: var(--ink); }
  textarea { min-height: 150px; resize: vertical; }
  input[type=file] { margin: 6px 0 12px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .primary { background: var(--accent); color: var(--accent-ink); border: 0; padding: 10px 20px;
             border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  .primary:disabled { opacity: .55; cursor: progress; }
  .ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); padding: 8px 14px;
           border-radius: 10px; font: inherit; cursor: pointer; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 0; }
  .chip { border: 1px solid var(--line); background: var(--bg); color: var(--ink); border-radius: 999px;
          padding: 4px 12px; font-size: 14px; cursor: pointer; }
  #status { margin-top: 12px; color: var(--muted); min-height: 24px; }
  #status.error { color: var(--bad); }
  #result { margin-top: 16px; }
  .result h3 { margin: 18px 0 6px; font-size: 15px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  .result h3:first-child { margin-top: 0; }
  .result ul { margin: 0; padding-left: 20px; }
  .scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 8px; }
  .score { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .score b { font-size: 24px; }
  .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .tags { display: flex; gap: 8px; flex-wrap: wrap; }
  .tag { padding: 3px 10px; border-radius: 999px; font-size: 14px; border: 1px solid var(--line); }
  .tag.on { background: var(--good); color: #fff; border-color: var(--good); }
  .muted { color: var(--muted); }
  .hist { border-top: 1px solid var(--line); padding: 12px 0; }
  .hist:first-child { border-top: 0; }
  .hist button { margin-top: 6px; }
  @media (max-width: 520px) { h1 { font-size: 22px; } }
</style>
</head>
<body>
<header>
  <h1>Мониторинг конкурентов</h1>
  <p>Финансовое сопровождение, аудит, тарифы: разбор текста, изображений и сайтов конкурентов</p>
</header>
<main>
  <nav role="tablist">
    <button role="tab" data-tab="text" aria-selected="true">Текст</button>
    <button role="tab" data-tab="image" aria-selected="false">Изображение</button>
    <button role="tab" data-tab="url" aria-selected="false">Сайт</button>
    <button role="tab" data-tab="history" aria-selected="false">История</button>
  </nav>

  <section class="card" id="tab-text">
    <label for="text">Текст конкурента: страница услуг, предложение, отчёт</label>
    <textarea id="text" placeholder="Вставьте текст (от 10 символов)"></textarea>
    <div class="row"><button class="primary" id="go-text">Проанализировать</button></div>
  </section>

  <section class="card" id="tab-image" hidden>
    <label for="file">Скриншот лендинга, баннер или страница документа (PNG, JPEG, WEBP, GIF, до 8 МБ)</label><br>
    <input type="file" id="file" accept="image/png,image/jpeg,image/webp,image/gif">
    <div class="row"><button class="primary" id="go-image">Проанализировать</button></div>
  </section>

  <section class="card" id="tab-url" hidden>
    <label for="url">Адрес страницы конкурента</label>
    <input type="url" id="url" placeholder="https://example.com/uslugi">
    <div class="chips" id="competitors"></div>
    <div class="row"><button class="primary" id="go-url">Открыть в Chrome и разобрать</button>
      <span class="muted">Откроется скрытое окно Chrome; разбор занимает 20–60 секунд</span></div>
  </section>

  <section class="card" id="tab-history" hidden>
    <div class="row" style="margin-top:0"><button class="ghost" id="clear-history">Очистить историю</button></div>
    <div id="history-list"></div>
  </section>

  <div id="status" role="status"></div>
  <div id="result"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const n = document.createElement(tag); if (text != null) n.textContent = text; if (cls) n.className = cls; return n; };

// --- вкладки ---
document.querySelectorAll('nav button').forEach((btn) => btn.addEventListener('click', () => {
  document.querySelectorAll('nav button').forEach((b) => b.setAttribute('aria-selected', String(b === btn)));
  ['text', 'image', 'url', 'history'].forEach((t) => { $('tab-' + t).hidden = t !== btn.dataset.tab; });
  $('result').replaceChildren(); setStatus('');
  if (btn.dataset.tab === 'history') loadHistory();
}));

function setStatus(msg, error = false) { $('status').textContent = msg; $('status').className = error ? 'error' : ''; }

// --- отрисовка результатов (всё через textContent: ответ модели не считается разметкой) ---
function scoreBox(label, value) {
  const box = el('div', null, 'score');
  box.append(el('div', label, 'muted'), el('b', `${value}/10`));
  const bar = el('div', null, 'bar'); const fill = el('i'); fill.style.width = `${value * 10}%`; bar.append(fill); box.append(bar);
  return box;
}
function list(title, items) {
  const wrap = document.createDocumentFragment();
  wrap.append(el('h3', title));
  if (!items || !items.length) { wrap.append(el('div', 'нет данных', 'muted')); return wrap; }
  const ul = el('ul'); items.forEach((i) => ul.append(el('li', i))); wrap.append(ul); return wrap;
}
function renderAnalysis(a, root) {
  const scores = el('div', null, 'scores');
  scores.append(scoreBox('Прозрачность цен', a.pricing_transparency), scoreBox('Глубина экспертизы по тарифам', a.tariff_expertise_depth));
  root.append(scores);
  const tags = el('div', null, 'tags');
  [['financial_support', 'финансовое сопровождение'], ['audit', 'аудит'], ['tariff_expertise', 'тарифы']]
    .forEach(([k, label]) => tags.append(el('span', label, 'tag' + (a.service_coverage[k] ? ' on' : ''))));
  root.append(el('h3', 'Какие направления есть у конкурента'), tags);
  if (a.summary) root.append(el('h3', 'Вывод'), el('div', a.summary));
  root.append(list('Сильные стороны', a.strengths), list('Слабые стороны', a.weaknesses),
              list('Уникальные предложения', a.unique_offers), list('Рекомендации', a.recommendations));
}
function renderImage(v, root) {
  const scores = el('div', null, 'scores');
  scores.append(scoreBox('Визуальный стиль', v.design_score), scoreBox('Элементы доверия', v.trust_score));
  root.append(scores);
  if (v.description) root.append(el('h3', 'Что на изображении'), el('div', v.description));
  if (v.design_analysis) root.append(el('h3', 'Оценка стиля'), el('div', v.design_analysis));
  root.append(list('Маркетинговые инсайты', v.marketing_insights), list('Рекомендации', v.recommendations));
}
function renderParsed(p, root) {
  root.append(el('h3', 'Собрано со страницы'));
  const ul = el('ul');
  [['Адрес', p.url], ['Заголовок', p.title], ['H1', p.h1], ['Первый абзац', p.first_paragraph],
   ['Разделы', (p.headings || []).join('; ')]].forEach(([k, v]) => ul.append(el('li', `${k}: ${v || '—'}`)));
  root.append(ul);
}
function show(kind, data) {
  const root = el('div', null, 'card result');
  if (kind === 'text') renderAnalysis(data, root);
  else if (kind === 'image') renderImage(data, root);
  else {
    renderParsed(data.parsed, root); renderAnalysis(data.analysis, root);
    if (data.visual) { root.append(el('h3', 'Скриншот первого экрана')); renderImage(data.visual, root); }
  }
  $('result').replaceChildren(root);
}

// --- запросы ---
async function call(button, run, kind, busyText) {
  button.disabled = true; $('result').replaceChildren(); setStatus(busyText);
  try {
    const response = await run();
    const body = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.detail && typeof body.detail === 'string' ? body.detail : `Ошибка ${response.status}`);
    setStatus(''); show(kind, body);
  } catch (e) { setStatus(e.message, true); }
  finally { button.disabled = false; }
}
$('go-text').onclick = (ev) => call(ev.target, () => fetch('/analyze_text', { method: 'POST',
  headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: $('text').value }) }), 'text', 'Анализирую текст…');
$('go-image').onclick = (ev) => {
  const file = $('file').files[0];
  if (!file) return setStatus('Выберите файл', true);
  const form = new FormData(); form.append('file', file);
  call(ev.target, () => fetch('/analyze_image', { method: 'POST', body: form }), 'image', 'Анализирую изображение…');
};
$('go-url').onclick = (ev) => call(ev.target, () => fetch('/parse_demo', { method: 'POST',
  headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url: $('url').value }) }), 'url', 'Открываю страницу в Chrome и анализирую…');

fetch('/competitors').then((r) => r.json()).then((items) => items.forEach((c) => {
  const chip = el('button', c.name, 'chip'); chip.title = c.focus;
  chip.onclick = () => { $('url').value = c.url; }; $('competitors').append(chip);
})).catch(() => {});

// --- история ---
async function loadHistory() {
  const box = $('history-list'); box.replaceChildren();
  const items = await (await fetch('/history')).json();
  if (!items.length) return box.append(el('p', 'Пока пусто', 'muted'));
  const names = { text: 'Текст', image: 'Изображение', parse: 'Сайт' };
  items.forEach((item) => {
    const row = el('div', null, 'hist');
    row.append(el('b', `${names[item.kind]} · `), el('span', item.input_preview),
               el('div', new Date(item.timestamp).toLocaleString('ru-RU'), 'muted'));
    const open = el('button', 'Показать результат', 'ghost');
    open.onclick = () => show(item.kind === 'parse' ? 'url' : item.kind, item.result);
    row.append(open); box.append(row);
  });
}
$('clear-history').onclick = async () => { await fetch('/history', { method: 'DELETE' }); loadHistory(); $('result').replaceChildren(); };
</script>
</body>
</html>
